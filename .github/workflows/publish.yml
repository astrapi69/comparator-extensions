# Publishes the artifact to Maven Central via the Central Portal (nmcp plugin), as resourcebundle-core does.
# Triggered by pushing a release tag (RELEASE-*), which always targets the release
# repository, or manually via workflow_dispatch, which asks where to publish.
#
# The manual snapshot run exists so this path can be EXECUTED rather than only wired: it
# exercises the checkout, the JDK setup, the Gradle setup, the secrets and the signature -
# everything the tag run does except the release bundle's check and upload. Run it after any change to
# this file, on develop, before a release tag depends on it (#12).
# Required repository secrets:
#   CENTRAL_PORTAL_TOKEN_USERNAME / CENTRAL_PORTAL_TOKEN_PASSWORD - Central Portal user token
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE    - ascii-armored signing key and its passphrase
#   GPG_KEY_ID (optional)               - the signing subkey's last 8 hex digits, when GPG_PRIVATE_KEY
#                                         holds that subkey alone (astrapi69/lethenon, docs/launch/release-key.md)

name: Publish to Maven Central

on:
  push:
    tags: [ 'RELEASE-*' ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Where to publish (a tag push always publishes a release)'
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - release

jobs:
  publish:

    runs-on: ubuntu-latest

    env:
      # a tag push publishes a release; a manual run publishes what it was asked for
      PUBLISH_TASK: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'snapshot') && 'nmcpPublishAllPublicationsToCentralPortalSnapshots' || 'nmcpPublishAllPublicationsToCentralPortal' }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          # the open-source cache over actions/cache: the default provider of v6, enhanced, is the
          # proprietary gradle-actions-caching under the Terms of Use of Gradle (#67)
          cache-provider: basic
      - name: Build
        run: ./gradlew build
      # nmcp uploads and validates the bundle directly - no separate staging step
      - name: Publish to the Central Portal
        run: |
          echo "publishing with $PUBLISH_TASK"
          ./gradlew "$PUBLISH_TASK"
        env:
          CENTRAL_PORTAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_PORTAL_TOKEN_USERNAME }}
          CENTRAL_PORTAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_PORTAL_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
