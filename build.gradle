buildscript {
    repositories {
        maven {
            url = projectRepositoriesMavenUrl
        }
    }
}

plugins {
    id 'jacoco'
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'signing'
    alias(libs.plugins.gradle.versions.plugin)
    alias(libs.plugins.nmcp.gradle.plugin)
    alias(libs.plugins.pitest.gradle.plugin)
    alias(libs.plugins.spotless.plugin.gradle)
    alias(libs.plugins.test.results.complete)
    alias(libs.plugins.version.catalog.update)
}

group = "$groupPackage" as Object
version = "$projectVersion" as Object
description = "$rootProject.name"

// import gradle files
apply from: "gradle/apply-gradle-files.gradle"

// Mutation-score floor that PIT fails below: .github/workflows/mutation-testing.yml runs
// `./gradlew pitest` on GitHub, in a run of its own (#33); PIT rounds the score half up to a whole
// percent before it compares, and holds it at 99 while a mutant survives. Set on 2026-11-05 (#21),
// when the tests killed every mutant, 100 %, up from 91.6 %; the numbers of a release are in its
// CHANGELOG entry, from the run on its merge commit. The floor is that score minus about two
// points, rounded down: a few mutants more that survive, such as those of a new method whose tests
// are not complete yet, do not fail the build at once, a drop of more than about two points does.
// Of 80 to 119 mutants it fails from 3 survivors on, as 97.5 % is what PIT still rounds to 98.
// Kept here, not in gradle/mutation-testing.gradle, so that the floor sits in the file a reader
// (and awesome-well-tested's check) looks at.
pitest {
    mutationThreshold = 98
}

java {
    sourceCompatibility = "$projectSourceCompatibility" as Object
    toolchain {
        languageVersion = JavaLanguageVersion.of("$projectSourceCompatibility")
    }
}

tasks.withType(JavaCompile).configureEach { javaCompiler ->
    options.encoding = "UTF-8"
    // Every lint category of javac in every build, as mystic-crypt has it, so that a new warning shows
    // (#61). Deliberately without -Werror: a dependency or JDK update that brings a warning must not
    // break the build, only show it. Without dangling-doc-comments: the license header that Spotless
    // writes into every file (gradle/formatting.gradle) opens with /**, as in the family, and that
    // category would flag it in every file
    options.compilerArgs << "-Xlint:all,-dangling-doc-comments"
}

tasks.named("test") {
    it.mustRunAfter(tasks.named("jar"))
}
