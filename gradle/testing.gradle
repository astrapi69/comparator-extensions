/**
 * What a consumer that declares this library alone compiles against (#36): this project resolved the way a
 * consumer's compile class path resolves it, the java-api usage of a library in a jar, that is its apiElements,
 * from which the published Gradle module metadata takes its apiElements variant. It holds the built jar and the
 * api dependencies; an implementation dependency stays out of it, as it stays out of a consumer's compiler.
 */
def consumerDependencyScope = configurations.dependencyScope('consumerDependencies')
def consumerClasspath = configurations.resolvable('consumerCompileClasspath') {
    extendsFrom(consumerDependencyScope.get())
    attributes {
        attribute(Usage.USAGE_ATTRIBUTE, objects.named(Usage, Usage.JAVA_API))
        attribute(Category.CATEGORY_ATTRIBUTE, objects.named(Category, Category.LIBRARY))
        attribute(LibraryElements.LIBRARY_ELEMENTS_ATTRIBUTE, objects.named(LibraryElements, LibraryElements.JAR))
        attribute(Bundling.BUNDLING_ATTRIBUTE, objects.named(Bundling, Bundling.EXTERNAL))
    }
}

dependencies {
    consumerDependencies project(path)
}

/**
 * Hands that compile class path to ModulePathTest, which compiles consumers against it, a module on the module
 * path (#15) as swing-base-components does it for its ModulePathTest, and a class on the class path (#36). It is
 * an input of the test task, so the test task runs after jar and reruns when it changes; it is read when the test
 * JVM starts, so the configuration cache keeps working.
 */
abstract class ModulePathTestArguments implements CommandLineArgumentProvider {

    @Classpath
    abstract ConfigurableFileCollection getConsumerCompileClasspath()

    @Override
    Iterable<String> asArguments() {
        ["-Dmodule.path.test.consumer.compile.classpath=${consumerCompileClasspath.asPath}".toString()]
    }
}

/**
 * Hands the pom that a publication carries to PublishedPomTest, which reads the scope of each dependency from it,
 * the scope a Maven consumer gets (#36). It is an input of the test task, so the pom is generated first.
 */
abstract class PublishedPomTestArguments implements CommandLineArgumentProvider {

    @InputFiles
    @PathSensitive(PathSensitivity.NONE)
    abstract ConfigurableFileCollection getPom()

    @Override
    Iterable<String> asArguments() {
        ["-Dpublished.pom.test.pom=${pom.singleFile.absolutePath}".toString()]
    }
}

def modulePathTestArguments = objects.newInstance(ModulePathTestArguments)
modulePathTestArguments.consumerCompileClasspath.from(consumerClasspath)

def publishedPomTestArguments = objects.newInstance(PublishedPomTestArguments)
publishedPomTestArguments.pom.from(tasks.named('generatePomFileForMavenJavaPublication'))

test {
    useJUnitPlatform()
    jvmArgumentProviders.add(modulePathTestArguments)
    jvmArgumentProviders.add(publishedPomTestArguments)
}

// The JaCoCo version comes from the version catalog, as the versions of PIT do, so that
// versionCatalogUpdate moves it and a Gradle upgrade does not: without it the build takes the version
// Gradle bundles (0.8.15 with Gradle 9.8.2), and the floor below would measure with a tool that a
// wrapper change picks (#66)
jacoco {
    toolVersion = libs.versions.jacoco.version.get()
}

jacocoTestReport {
    reports {
        xml.required.set(true)
        html.required.set(true)
    }
}

// Coverage floor the build fails below (#21), set when every line and every branch was covered,
// 100 % each; the numbers of a release are in its CHANGELOG entry, measured by its release gate. The
// floor is each measure minus about two points, rounded down, as for the mutation score in
// build.gradle: a few lines that the tests of a new method do not reach yet do not fail the build at
// once, a drop of more than about two points does. Of 100 to 149 lines it fails from 3 missed lines
// on; of fewer than 50 branches from the first missed branch, as one branch is then more than 2
// points.
jacocoTestCoverageVerification {
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
            limit {
                counter = 'BRANCH'
                value = 'COVEREDRATIO'
                minimum = 0.98
            }
        }
    }
}

jacocoTestCoverageVerification.dependsOn test
check.dependsOn jacocoTestReport
check.dependsOn jacocoTestCoverageVerification
